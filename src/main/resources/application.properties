spring.application.name=ms-academico
server.port=8081

spring.profiles.default=mysql

# Eureka (arrancar eureka-server en 8761 antes que este servicio)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Curso predeterminado (se crea al iniciar si no hay cursos en la BD)
app.curso-inicial.nivel=2 Medio
app.curso-inicial.letra=A
app.curso-inicial.anio=2026
app.curso-inicial.profesor-jefe-rut=12345678-9

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
